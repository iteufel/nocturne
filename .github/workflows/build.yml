name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', '**.md']
  pull_request:
    paths-ignore: ['site/**', 'docs/**', '**.md']
  workflow_dispatch:
    inputs:
      publish_broker:
        description: Publish the broker to Docker Hub (also updates the live broker)
        type: boolean
        default: false
      publish_testflight:
        description: Upload a new iOS build to TestFlight after checks pass
        type: boolean
        default: true
      publish_macos:
        description: Publish a signed and notarized Mac server after checks pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  NOCTURNE_TEST_DISPLAYS: '0'
  NOCTURNE_TEST_DISPLAY_SWITCH: '0'

jobs:
  broker_verify:
    name: Test the Linux broker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: remote
      - name: Test build orchestration
        run: python3 scripts/tests/test-build-orchestration.py
      - name: Check and test Rust services
        run: |
          cargo fmt --manifest-path remote/Cargo.toml --all --check
          cargo clippy --manifest-path remote/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo test --manifest-path remote/Cargo.toml --locked --workspace
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the broker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: remote/Dockerfile
          platforms: linux/amd64
          load: true
          tags: nocturne-broker
          cache-from: type=gha,scope=broker
          cache-to: type=gha,mode=max,scope=broker

  broker_publish:
    name: Publish broker to Docker Hub
    needs: broker_verify
    if: >-
      github.repository == 'iteufel/nocturne' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_broker))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: broker-dockerhub-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: iteufel
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish Linux amd64 image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: remote/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            iteufel/nocturne-broker:latest
            iteufel/nocturne-broker:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/iteufel/nocturne
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=broker
          cache-to: type=gha,mode=max,scope=broker
      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'Published `iteufel/nocturne-broker:latest` and `sha-%s` at `%s`.\n' "$GITHUB_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Test the iPhone and iPad client
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: remote
          key: ios-simulator-xcode-27
      - name: Prepare pinned dependencies
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          scripts/bootstrap.sh ios-simulator
      - name: Test stream jitter and recovery
        run: |
          bash scripts/test-stream-audio.sh
          bash scripts/test-stream-video.sh
      - name: Test the iPhone and iPad client
        run: scripts/test-ios-ci.sh
      - name: Save client test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ClientTests
          path: .build/ClientTests
          retention-days: 7

  macos_verify:
    name: Test and build the Mac server
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: remote
          key: mac-xcode-27
      - name: Prepare pinned dependencies
        run: |
          xcodebuild -version
          brew install cmake pkgconf miniupnpc openssl@3
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          scripts/bootstrap.sh mac
      - name: Test the broker and remote transport
        run: |
          cargo test --manifest-path remote/Cargo.toml --locked --workspace
          cargo build --manifest-path remote/Cargo.toml --locked -p nocturne-broker
      - name: Test shared and host services
        run: env -u NOCTURNE_ENGINE_EXECUTABLE NOCTURNE_BROKER_EXECUTABLE="$PWD/remote/target/debug/nocturne-broker" swift test
      - name: Test microphone driver with sanitizers
        run: bash scripts/test-microphone-driver.sh
      - name: Build the unified macOS server
        run: scripts/build.sh mac
      - name: Test locked-screen capture with sanitizers
        run: bash scripts/test-stream-lock-screen.sh
      - name: Test capture rejection and callback lifecycle with sanitizers
        run: python3 scripts/test-stream-capture.py

  testflight:
    name: Release iOS to TestFlight
    needs: [verify, macos_verify, broker_verify]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_testflight))
    runs-on: xcode-27
    timeout-minutes: 60
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps/${{ vars.APPSTORE_APP_ID }}/testflight
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: remote
          key: ios-device-xcode-27
      - name: Prepare pinned dependencies
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          scripts/bootstrap.sh ios-device
      - name: Import the distribution identity
        uses: Apple-Actions/import-codesign-certs@fe74d46e82474f87e1ba79832ad28a4013d0e33a # v6
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Download the App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7
        with:
          bundle-id: app.nocturne.client
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Download the Files extension provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7
        with:
          bundle-id: app.nocturne.client.files
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Archive and export iOS
        env:
          NOCTURNE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          NOCTURNE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: scripts/archive-ios.sh
      - name: Upload and wait for Apple processing
        uses: Apple-Actions/upload-testflight-build@155ea93be9ee6d5186c71f660a612f5eddb14510 # v5
        with:
          app-path: .build/TestFlight/export/Nocturne.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'true'
          release-notes: |
            Nocturne beta from commit ${{ github.sha }}.
            Test pairing, streaming, keyboard and controller input, terminal tabs, and file transfers.
      - name: Record the uploaded build
        run: |
          printf 'TestFlight build **%s.%s** from `%s` finished processing.\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove provisioning profiles
        if: always()
        run: |
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision

  macos_release:
    name: Release signed macOS server
    needs: [macos_verify, broker_verify]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_macos))
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
    environment:
      name: macos-release
      url: https://github.com/iteufel/nocturne/releases
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: remote
          key: mac-xcode-27
      - name: Prepare pinned dependencies
        run: |
          xcodebuild -version
          brew install cmake pkgconf miniupnpc openssl@3
          gem install --user-install xcodeproj -v 1.27.0 --no-document
          scripts/bootstrap.sh mac
      - name: Import the Developer ID identity
        uses: Apple-Actions/import-codesign-certs@fe74d46e82474f87e1ba79832ad28a4013d0e33a # v6
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      - name: Build, sign, notarize, and verify the Mac server
        env:
          NOCTURNE_DEVELOPER_ID: ${{ vars.MACOS_SIGNING_IDENTITY }}
          NOCTURNE_DEVELOPMENT_TEAM: ${{ vars.APPLE_TEAM_ID }}
          NOCTURNE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          NOCTURNE_NOTARY_KEY_ID: ${{ vars.NOTARY_KEY_ID }}
          NOCTURNE_NOTARY_ISSUER_ID: ${{ vars.NOTARY_ISSUER_ID }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
        run: |
          umask 077
          export NOCTURNE_NOTARY_KEY_PATH="$RUNNER_TEMP/nocturne-notary.p8"
          printf '%s' "$NOTARY_API_PRIVATE_KEY" > "$NOCTURNE_NOTARY_KEY_PATH"
          unset NOTARY_API_PRIVATE_KEY
          scripts/release-macos.sh
      - name: Save the notarized Mac download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nocturne-macOS-arm64
          path: |
            .build/MacRelease/Nocturne-macOS-arm64.zip
            .build/MacRelease/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
      - name: Publish the Mac preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' '.build/MacRelease/Nocturne.app/Contents/Info.plist')
          build="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          cat > "$RUNNER_TEMP/mac-release-notes.md" <<EOF
          Nocturne for Apple Silicon Macs running macOS 14 or later.

          Signed with Developer ID, notarized by Apple, and verified by Gatekeeper.
          Download the ZIP, unzip it, quit any running copy of Nocturne,
          and move Nocturne.app to Applications.

          This is an early preview. Virtual-display and monitor-off features have
          an unresolved black-screen issue; keep those features disabled.

          Built from commit $GITHUB_SHA. The ZIP includes Apple's notarization ticket.
          SHA256SUMS.txt contains the download checksum.
          EOF
          release_url=$(gh release create "server-v$version-$build" \
            .build/MacRelease/Nocturne-macOS-arm64.zip \
            .build/MacRelease/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Nocturne $version ($build)" \
            --prerelease --notes-file "$RUNNER_TEMP/mac-release-notes.md")
          printf 'Signed and notarized Mac release: %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Save Mac signing diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mac-signing-diagnostics
          path: |
            .build/MacRelease/signature.txt
            .build/MacRelease/submission.json
            .build/MacRelease/notarization.json
            .build/MacRelease/notarization-log.json
          retention-days: 7
      - name: Remove the notarization private key
        if: always()
        run: rm -f "$RUNNER_TEMP/nocturne-notary.p8"
