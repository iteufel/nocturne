[workspace]
members = ["broker", "tunnel"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
